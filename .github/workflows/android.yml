name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boombox-1.1.0
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Boombox 1.1.0
          body: |
            **Boombox 1.1.0** — release-сборка (не debug).

            - Жанры в библиотеке и поиске
            - Скачивание всей дискографии исполнителя
            - Фоновые загрузки с уведомлением (можно выключить)
            - Структура папок: по умолчанию Исполнитель/Альбом, можно сменить
            - Импорт уже скачанных файлов после переустановки
            - Скрытие мини-плеера останавливает музыку
            - Исправлено случайное включение трека при открытии альбома

            Установка: скачайте `app-release.apk`, разрешите установку из неизвестных источников и откройте файл. Можно поставить поверх прошлой версии.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
